name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Quick gate (vet + test)
        run: |
          go vet ./...
          go test -race ./...

      - name: Bump version and tag
        id: bump
        run: |
          CURRENT=$(grep 'const Version' internal/version/version.go | sed 's/.*= "//;s/"//')
          echo "Current version: $CURRENT"

          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "New version: $NEW_VERSION"

          sed -i "s/const Version = \"$CURRENT\"/const Version = \"$NEW_VERSION\"/" internal/version/version.go

          git add internal/version/version.go
          git commit -m "chore(release): bump version to $NEW_VERSION [skip ci]"
          git tag "$NEW_VERSION"

          # Handle race: rebase if main moved while we were testing
          git pull --rebase origin main || true

          git push origin main
          git push origin "$NEW_VERSION"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
